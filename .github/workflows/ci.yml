name: Productcontrole

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node.js 22 LTS
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Dependencies
        run: npm ci

      - name: Dependencybeveiliging
        run: npm audit --audit-level=moderate

      - name: Productchecks, typecheck en Pages-artifact
        run: npm run build:pages
